# /etc/netplan/01-siem01.yaml
# SIEM-01 — 192.168.56.10
# Adapter names vary by install; confirm with `ip a` and edit enp0s3 / enp0s8 below.
network:
  version: 2
  ethernets:
    enp0s3:            # NAT adapter — internet for package installs only
      dhcp4: true
    enp0s8:             # Host-only adapter — lab network
      dhcp4: false
      addresses:
        - 192.168.56.10/24
      nameservers:
        addresses: [1.1.1.1]
