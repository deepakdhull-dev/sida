# /etc/chrony/chrony.conf on IDS-01 and UBU-APP01
# Points at SIEM-01 as the sole time source for the lab.

server 192.168.56.10 iburst prefer

driftfile /var/lib/chrony/chrony.drift
keyfile /etc/chrony/chrony.keys
logdir /var/log/chrony

# Verify with: chronyc sources -v
# Reference should show 192.168.56.10 selected (*).
