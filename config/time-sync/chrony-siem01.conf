# /etc/chrony/chrony.conf on SIEM-01
# SIEM-01 acts as the single time source for the lab network.
# No upstream NTP servers are required since the host-only network
# has no guaranteed internet reachability.

# Serve time even if chrony cannot reach a usable upstream source,
# using the local system clock as a fallback (lab-only setting).
local stratum 10

# Allow lab subnet clients to sync from this host.
allow 192.168.56.0/24

# Standard drift and key files.
driftfile /var/lib/chrony/chrony.drift
keyfile /etc/chrony/chrony.keys
logdir /var/log/chrony
